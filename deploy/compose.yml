name: planner

services:
  planner:
    build:
      context: ./src
    image: planner:local
    container_name: planner
    restart: unless-stopped

    # APP_KEY and the rest. 0600 root.
    env_file: .env

    environment:
      # FrankenPHP serves plain HTTP on 80; the box's Caddy terminates TLS.
      SERVER_NAME: ":80"
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: sqlite
      # On the volume, deliberately outside database/ so the mount cannot hide
      # the migrations and seeders.
      DB_DATABASE: /data/database.sqlite
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync

    volumes:
      - ./data:/data

    # No host port on purpose. Caddy reaches this over the compose bridge, the
    # same as n8n and OpenWebUI. A line in `ss -tln` for this service is a
    # regression, not a convenience.
